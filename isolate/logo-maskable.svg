<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant of the Sahakar Seva icon.

  Android and iOS crop a maskable icon to whatever shape the launcher uses
  (circle, squircle, rounded square), and they crop HARD — roughly the outer
  10% on each edge. Artwork that fills the canvas gets its corners clipped.

  So the gradient here is painted edge-to-edge with no rounded corners of its
  own (the platform supplies the shape), and the glyph is scaled down to sit
  inside the 80% safe zone centred on the canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sahakar Seva">
  <defs>
    <linearGradient id="sahMaskableGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sahMaskableGradient)" />
  <text
    x="256"
    y="256"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Noto Sans Devanagari, Mangal, Nirmala UI, sans-serif"
    font-size="200"
    font-weight="700"
    fill="#ffffff"
  >सह</text>
</svg>
