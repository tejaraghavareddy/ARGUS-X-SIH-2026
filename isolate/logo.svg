<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sahakar Seva app icon.

  Mirrors the SahMark component in src/pages/Landing.tsx: an emerald gradient
  rounded square carrying the Devanagari "सह". Vector so it stays crisp from a
  48px home-screen badge up to a 512px store listing, and so the PWA manifest
  needs no raster variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sahakar Seva">
  <defs>
    <linearGradient id="sahGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#sahGradient)" />
  <text
    x="256"
    y="256"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Noto Sans Devanagari, Mangal, Nirmala UI, sans-serif"
    font-size="260"
    font-weight="700"
    fill="#ffffff"
  >सह</text>
</svg>
